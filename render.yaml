services:
  - type: web
    name: lottery-system
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lottery-db
          property: connectionString
      - key: ADMIN_PASSWORD
        generateValue: false
        sync: false

databases:
  - name: lottery-db
    plan: free
    databaseName: lottery
    user: lottery_user
